<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TinyMCE Test</title>


<script
    src="https://cdn.tiny.cloud/1/no-api-key/tinymce/7/tinymce.min.js"
    referrerpolicy="origin"
    crossorigin="anonymous"
    onload="initTinyMCE()"
    onerror="console.log('TinyMCE load nahi hua')">
</script>

<script>
    function initTinyMCE() {
        tinymce.init({
            selector: '#mytextarea',
            height: 400,
            menubar: true,
            plugins: 'lists link table code',
            toolbar: 'undo redo | blocks | bold italic underline | bullist numlist | link table | code',
            license_key: 'gpl'
        });
    }
</script>


</head>

<body>


<h2>TinyMCE Editor Test</h2>

<form>
    <textarea id="mytextarea" name="content">Hello, World!</textarea>

    <br>

    <button type="button" id="bt">Show HTML</button>
</form>

<h3>HTML Output:</h3>

<div id="myHtml"></div>

<script>
    document.getElementById('bt').addEventListener('click', function () {

        const content = tinymce.get('mytextarea').getContent();

        document.getElementById('myHtml').textContent = content;

    });
</script>


</body>
</html>
